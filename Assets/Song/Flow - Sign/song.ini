loading_phrase = Sign is Flow's eighteenth single. Its A-Side was used as the sixth opening theme song for Naruto Shippuden. The single has two editions: regular and limited. The limited edition includes a bonus CD with extra tracks, a wide cap sticker, double-sided jacket, and Sharingan sticker. It reached number 4 on the Oricon charts in its first week and charted for 6 weeks.